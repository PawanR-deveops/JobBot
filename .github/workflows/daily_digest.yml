name: Daily Digest (9 AM IST)

on:
  schedule:
    - cron: '30 3 * * *'   # 3:30 UTC = 9:00 AM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git for data commits
        run: |
          git config user.email "jobhuntbot@users.noreply.github.com"
          git config user.name "JobHunt Bot"

      - name: Run daily digest
        run: python digest_action.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Push data to repo
        if: always()
        run: |
          git add data/ || true
          git diff --staged --quiet || git commit -m "digest: update daily log"
          git push || true
