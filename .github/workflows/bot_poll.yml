name: Telegram Bot (Interactive)

on:
  schedule:
    - cron: '0 */4 * * *'   # Failsafe: restart every 4h if self-trigger missed
  workflow_dispatch:

concurrency:
  group: bot-poll
  cancel-in-progress: false   # Never cancel a running bot, queue next one

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 230

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.email "jobhuntbot@users.noreply.github.com"
          git config user.name "JobHunt Bot"

      - name: Run bot
        run: python main.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Push data changes on exit
        if: always()
        run: |
          git add data/ || true
          git diff --staged --quiet || git commit -m "bot: sync data on exit"
          git push || true

      - name: Self-restart — queue next run immediately
        if: always()
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/PawanR-deveops/JobBot/actions/workflows/bot_poll.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Next bot run queued"
