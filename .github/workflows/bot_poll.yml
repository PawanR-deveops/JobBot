name: Telegram Bot (Interactive)

# Keeps main.py running as a polling bot.
# Restarts every 4 hours (GitHub Actions timeout safety).
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 230

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.email "bot@jobbot.local"
          git config user.name "JobBot"

      - name: Set bot profile photo
        run: python set_logo.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

      - name: Run bot with auto-restart on crash
        run: |
          while true; do
            echo "Starting bot..."
            python main.py || true
            echo "Bot stopped. Pulling latest and restarting in 10 seconds..."
            git pull --rebase origin main || true
            sleep 10
          done
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ADMIN_CHAT_ID:  ${{ secrets.ADMIN_CHAT_ID }}

      - name: Push data changes on exit
        if: always()
        run: |
          git add data/ || true
          git diff --staged --quiet || git commit -m "bot: sync data on exit"
          git push || true
