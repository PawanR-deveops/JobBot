name: LinkedIn Job Scanner

on:
  schedule:
    - cron: '*/30 * * * *'   # runs every 30 minutes for near real-time alerts
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.email "bot@jobbot.local"
          git config user.name "JobBot"

      - name: Run scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scan.py

      - name: Push data updates
        if: always()
        run: |
          git add data/ || true
          git diff --staged --quiet || git commit -m "scan: update seen jobs and daily log"
          git push || true
