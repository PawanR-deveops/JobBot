name: LinkedIn Job Scanner (legacy — superseded by scan.yml)

# Disabled: scan.yml now handles periodic scanning.
# Keep for manual trigger only.
on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.email "bot@jobbot.local"
          git config user.name "JobBot"

      - name: Run scanner
        run: python scan.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ADMIN_CHAT_ID:  ${{ secrets.ADMIN_CHAT_ID }}

      - name: Push data updates
        if: always()
        run: |
          git add data/ || true
          git diff --staged --quiet || git commit -m "scan: update seen jobs and daily log"
          git push || true
